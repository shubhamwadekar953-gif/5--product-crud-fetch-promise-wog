<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product crud fetch promise wog</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <h1 class = "h1 bg-dark text-white text-center p-2 mb-5">5th PRODUCT CRUD FETCH PROMISE WOG</h1>
    <div class = "container">
        <div class = "row d-flex justify-contetn-between">
            <div class = "col-md-6 offset-3">
                <form id = "productForm">
                    <div class = "card m-5">
                        <h3 class = "h3 text-center p-1">PRODUCT FORM</h3>
                        <div class = "card-body">


                            <div class = "form-group mb-3">
                                <label for = "userId">User ID :</label>
                                <input type = "number" class = "form-control" id = "userId">
                            </div>

                             <div class = "form-group mb-3">
                                <label for = "pname">Product Name :</label>
                                <input type = "text" class = "form-control" id = "pName">
                            </div>

                             <div class = "form-group mb-3">
                                <label for = "imgUrl">Img Url :</label>
                                <input type = "link" class = "form-control" id = "imgUrl">
                            </div>

                             <div class = "form-group mb-5">
                                <label for = "mrp">MRP :</label>
                                <input type = "number" class = "form-control" id = "mrp">
                            </div>

                            <button type = "submit" class = "btn btn-primary" id = "submitBtn">Submit</button>
                            <button type = "button" class = "btn btn-success d-none" id = "updateBtn">Update</button>

                        
                        </div>
                    </div>
                </form>
            </div>


            <div class = "col-md-12">
                <div class = "card m-5">
                    <h3 class = "h3 text-center p-1">PRODUCT LIST</h3>
                    <div class = "card-body">
                        <table class = "table table-bordered text-danger">
                            <thead>
                                <tr>
                                    <th>USER ID</th>
                                    <th>PRODUCT NAME</th>
                                    <th>IMG URL</th>
                                    <th>MRP</th>
                                    <th>EDIT</th>
                                    <th>DELETE</th>
                                </tr>
                            </thead>
                            <tbody id = "productList">
                                <!-- <tr>
                                    <td>1</td>
                                    <td>oppo reno 2z</td>
                                    <td>img link</td>
                                    <td>22000</td>
                                    <td><i class = "btn btn-warning">Edit</i></td>
                                    <td><i class = "btn btn-danger">Remove</i></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    

     <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only"></span>
            </div>
     </div>



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src = "app.js"></script>
</body>
</html>
